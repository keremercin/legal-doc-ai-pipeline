[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-doc-ai-pipeline"
version = "0.1.0"
description = "OCR + classification + retrieval pipeline for legal documents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kerem Ercin" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "openai>=1.40.0",
  "pgvector>=0.3.2",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.31",
  "alembic>=1.13.2",
  "streamlit>=1.37.0",
  "pandas>=2.2.2",
  "numpy>=2.0.1",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "tenacity>=8.5.0",
  "pytesseract>=0.3.10",
  "pypdf>=4.3.1",
  "pillow>=10.4.0",
]


[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.6",
  "mypy>=1.11.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.setuptools.packages.find]
where = ["src"]
